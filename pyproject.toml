[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "transyfeet-evalgate"
version = "0.1.0"
description = "读取闸门配置，估算各配置的误报与漏报风险并指出可疑项"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "transyfeet" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://transyfeet.github.io"
Repository = "https://github.com/transyfeet/evalgate"
Issues = "https://github.com/transyfeet/evalgate/issues"

[project.scripts]
evalgate = "evalgate:main"

[tool.setuptools]
py-modules = ["evalgate"]
